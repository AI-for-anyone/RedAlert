[tool.poetry]
name = "show-result"
version = "0.0.1"
authors = [
    "Mofa Bot"
]
description = "A user new node template"
license = "MIT"
homepage = "https://github.com/moxin-org/mofa"
documentation = "https://github.com/moxin-org/mofa/blob/main/README.md"
readme = "README.md"
packages = [{ include = "result" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
pyarrow = ">= 5.0.0"

[tool.poetry.scripts]
show-result = "result.main:main"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"