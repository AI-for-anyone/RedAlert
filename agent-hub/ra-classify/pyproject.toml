[project]
name = "ra-classify"
version = "0.0.1"
authors = [
    {name = "Mofa Bot"}
]
description = "ra-classify"
license = {text = "MIT"}
dependencies = [
    "python-dotenv>=1.0.0"
]
requires-python = ">=3.10,<3.13"

[project.scripts]
ra-classify = "classify.main:main"

[tool.setuptools.packages.find]
include = ["classify*"]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"