[project]
name = "ra-mcp-cli"
version = "0.0.1"
authors = [
    {name = "Mofa Bot"}
]
description = "ra-mcp-cli"
license = {text = "MIT"}
requires-python = ">=3.10,<3.13"

[project.scripts]
ra-mcp-cli = "mcp-cli.main:main"

[tool.setuptools.packages.find]
include = ["mcp-cli*"]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"